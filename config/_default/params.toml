mainSections   = ["post"]
rssFullContent = true
favicon        = "img/favicon.png"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    subtitle = "What Just Happened NOW"
    avatar   = "img/avatar.png"

[[sidebar.social]]
    name = "Facebook"
    url  = "https://facebook.com/wjhnow"      # ← Change this

[[sidebar.social]]
    name = "X"
    url  = "https://x.com/wjhnow"         # ← Change this

[article]
    headingAnchor = false
    math          = false
    readingTime   = true
    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
    toggle  = true
    default = "auto"

[comments]
    enabled = false
