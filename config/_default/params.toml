mainSections = ["post"]
rssFullContent = true
favicon        = "img/favicon.png"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    subtitle = "Tracking global incidents in real time" # ← change this
    avatar   = "img/avatar.png"              # see step 3

[article]
    headingAnchor = false
    math          = false
    readingTime   = true

    [article.license]
        enabled = false                      # set to true if you want a license notice

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
    toggle  = true
    default = "auto"                         # or "dark" / "light"

[comments]
    enabled  = false                         # turn on later if you want comments

    # Explicitly overrides and removes the fallback theme social links
[[sidebar.social]]
name = ""
url = ""

