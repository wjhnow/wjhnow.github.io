media:
  input: static/img
  output: /img

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/post
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, image]
      sort: date
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        options:
          format: "yyyy-MM-dd"
      - name: description
        type: text
      - name: image
        type: image
        label: Cover Image
      - name: tags
        label: Tags
        type: string
        list: true
        required: false
      - name: categories
        label: Categories
        type: string
        list: true
        required: false
        
